# Environnement local complet : docker compose up --build
# Les services d'infrastructure n'écoutent que sur 127.0.0.1 (jamais exposés publiquement).
name: ai-scene-studio

x-api-env: &api-env
  ASS_ENVIRONMENT: ${ASS_ENVIRONMENT:-development}
  ASS_LOG_LEVEL: ${ASS_LOG_LEVEL:-INFO}
  ASS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ass}:${POSTGRES_PASSWORD:-ass}@postgres:5432/${POSTGRES_DB:-ass}
  ASS_REDIS_URL: redis://redis:6379/0
  ASS_S3_ENDPOINT_URL: http://storage:8333
  ASS_S3_BUCKET: ${S3_BUCKET:-ass-media}
  ASS_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-dev-access-key}
  ASS_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-dev-secret-key-change-me}
  ASS_CORS_ALLOWED_ORIGINS: ${ASS_CORS_ALLOWED_ORIGINS:-http://localhost:3000}

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ass}
      POSTGRES_DB: ${POSTGRES_DB:-ass}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.6-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis-data:/data
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Stockage objet compatible S3 (SeaweedFS ; les images MinIO ne sont plus distribuées publiquement).
  storage:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ['/bin/sh', '/etc/seaweedfs/entrypoint.sh']
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-dev-access-key}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-dev-secret-key-change-me}
    volumes:
      - ./infrastructure/docker/seaweedfs/entrypoint.sh:/etc/seaweedfs/entrypoint.sh:ro
      - ./infrastructure/docker/seaweedfs/s3.json.template:/etc/seaweedfs/s3.json.template:ro
      - storage-data:/data
    ports:
      - '127.0.0.1:8333:8333'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30

  # Tâches ponctuelles : création du bucket puis migrations de schéma.
  storage-init:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    image: ai-scene-studio/api:dev
    command: ['python', '-m', 'ass_api.cli', 'ensure-bucket']
    environment: *api-env
    depends_on:
      storage: { condition: service_healthy }
    restart: 'no'

  migrate:
    image: ai-scene-studio/api:dev
    command: ['alembic', '-c', 'infrastructure/migrations/alembic.ini', 'upgrade', 'head']
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
      storage-init: { condition: service_completed_successfully }
    restart: 'no'

  api:
    image: ai-scene-studio/api:dev
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    ports:
      - '127.0.0.1:8000:8000'
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: ai-scene-studio/web:dev
    depends_on:
      api: { condition: service_healthy }
    ports:
      - '127.0.0.1:3000:3000'
    restart: unless-stopped

  # Reverse proxy optionnel (profil « proxy ») : docker compose --profile proxy up
  nginx:
    image: nginx:1.28-alpine
    profiles: ['proxy']
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    ports:
      - '127.0.0.1:8080:80'

volumes:
  postgres-data:
  redis-data:
  storage-data:
