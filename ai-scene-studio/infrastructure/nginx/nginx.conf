# Reverse proxy : /api/* → API FastAPI, le reste → Next.js.
worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  client_max_body_size 100m;   # les gros fichiers passeront par upload multipart S3 direct
  sendfile on;

  log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
                              '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
                              '"duration":$request_time,"request_id":"$request_id"}';
  access_log /dev/stdout json;

  upstream api { server api:8000; }
  upstream web { server web:3000; }

  server {
    listen 80;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
      proxy_pass http://api/;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
      # Flux SSE de suivi des jobs : pas de mise en tampon.
      proxy_buffering off;
    }

    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
