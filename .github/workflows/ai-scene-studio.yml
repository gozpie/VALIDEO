name: AI Scene Studio CI

on:
  push:
    paths: ['ai-scene-studio/**', '.github/workflows/ai-scene-studio.yml']
  pull_request:
    paths: ['ai-scene-studio/**', '.github/workflows/ai-scene-studio.yml']

permissions:
  contents: read

concurrency:
  group: ass-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ai-scene-studio

jobs:
  typescript:
    name: TypeScript (format, lint, types, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ai-scene-studio/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: ai-scene-studio/.nvmrc
          cache: pnpm
          cache-dependency-path: ai-scene-studio/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - name: Vérifie que le JSON Schema de scène est à jour
        run: pnpm schema:generate && git diff --exit-code packages/scene-schema/schema
      - run: pnpm --filter @ass/web run build

  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.32'
          python-version: '3.13'
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy apps/api/src apps/api/tests infrastructure/migrations
      - run: uv run pytest apps/api -m "not integration"

  stack:
    name: Intégration (Docker Compose, tests réels, E2E)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [typescript, python]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ai-scene-studio/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: ai-scene-studio/.nvmrc
          cache: pnpm
          cache-dependency-path: ai-scene-studio/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.32'
          python-version: '3.13'
      - run: cp .env.example .env
      - name: Construit et démarre la pile complète
        run: docker compose up --build --wait --wait-timeout 300
      - run: curl --fail --silent http://localhost:8000/health/ready
      - run: uv sync --frozen
      - name: Tests d'intégration (PostgreSQL, Redis, S3 réels)
        run: ASS_RUN_INTEGRATION=1 uv run pytest apps/api -m integration
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ass/web exec playwright install --with-deps chromium
      - name: E2E contre le conteneur web
        run: pnpm test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: ai-scene-studio/apps/web/playwright-report
          retention-days: 7
      - if: always()
        run: docker compose down --volumes
